[workspace]
members = [
    "crates/jury",
    "crates/jury-core",
    "crates/jury-filesystem",
    "crates/jury-protected",
    "crates/jury-protocol",
    "crates/jury-tui",
    "crates/jury-witness",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
