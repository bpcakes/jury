[package]
name = "jury-suite2-conformance"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
hpke = { version = "=0.14.0", git = "https://github.com/rozbb/rust-hpke", rev = "57b14d8f156da78be61b23203b962b0985561831", default-features = false, features = ["alloc", "aes", "chacha", "mlkem", "x25519"] }
aes-gcm = { version = "=0.11.0", default-features = false, features = ["aes", "zeroize"] }
ghash = { version = "=0.6.0", default-features = false, features = ["zeroize"] }
chacha20 = { version = "=0.10.2", default-features = false, features = ["rng", "zeroize"] }
serde_json = "=1.0.145"
hex = "=0.4.3"

chacha20poly1305 = { version = "=0.11.0", default-features = false }

aes = { version = "=0.9.3", default-features = false, features = ["zeroize"] }
