[package]
name = "jury-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
ed25519-dalek = "=3.0.0"
clap = { version = "=4.5.50", features = ["derive"] }
libfuzzer-sys = "=0.4.13"
jury = { path = "../crates/jury" }
jury-protocol = { path = "../crates/jury-protocol" }
jury-core = { path = "../crates/jury-core" }
jury-filesystem = { path = "../crates/jury-filesystem" }
jury-witness = { path = "../crates/jury-witness" }
serde = "=1.0.229"
serde_json = "=1.0.145"
sha2 = "=0.11.0"

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "witness"
path = "fuzz_targets/witness.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_artifacts"
path = "fuzz_targets/core_artifacts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "input_boundaries"
path = "fuzz_targets/input_boundaries.rs"
test = false
doc = false
bench = false
