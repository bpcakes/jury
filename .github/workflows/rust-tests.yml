name: Rust Tests

on:
  pull_request:
    paths:

      - "**"

      - "**/*.rs"

      - "**/.cargo/**"

      - "**/.clippy.toml"

      - "**/.rustfmt.toml"

      - "**/Cargo.lock"

      - "**/Cargo.toml"

      - "**/clippy.toml"

      - "**/rust-toolchain"

      - "**/rust-toolchain.toml"

      - "**/rustfmt.toml"

      - ".cargo/**"

      - ".clippy.toml"

      - ".rustfmt.toml"

      - "Cargo.lock"

      - "Cargo.toml"

      - "clippy.toml"

      - "rust-toolchain"

      - "rust-toolchain.toml"

      - "rustfmt.toml"


      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/jig"
      - "scripts/install-jig.sh"
      - ".github/workflows/rust-tests.yml"
  push:
    branches:
      - "main"
    paths:

      - "**"

      - "**/*.rs"

      - "**/.cargo/**"

      - "**/.clippy.toml"

      - "**/.rustfmt.toml"

      - "**/Cargo.lock"

      - "**/Cargo.toml"

      - "**/clippy.toml"

      - "**/rust-toolchain"

      - "**/rust-toolchain.toml"

      - "**/rustfmt.toml"

      - ".cargo/**"

      - ".clippy.toml"

      - ".rustfmt.toml"

      - "Cargo.lock"

      - "Cargo.toml"

      - "clippy.toml"

      - "rust-toolchain"

      - "rust-toolchain.toml"

      - "rustfmt.toml"


      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/jig"
      - "scripts/install-jig.sh"
      - ".github/workflows/rust-tests.yml"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  workflow_call:
    inputs:
      release_validation:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.release_validation && format('release-rust-{0}', github.sha) || format('rust-ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.release_validation }}

jobs:
  fmt:
    name: scripts/jig check api:fmt
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
          components: rustfmt
      - name: Run rustfmt check
        run: scripts/jig check api:fmt

  clippy:
    name: scripts/jig check api:clippy
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
          components: clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run clippy
        run: scripts/jig check api:clippy

  # Complementary package selections preserve the complete workspace suite.
  # Separate runners keep each command within the existing 30-minute bound.
  test-libraries:
    name: scripts/jig check api:test-libraries-locked
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run locked library tests
        run: scripts/jig check api:test-libraries-locked

  test:
    name: scripts/jig check api:test-cli-locked
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run locked CLI crate tests
        run: scripts/jig check api:test-cli-locked
      - name: Build the native CLI and witness daemon
        run: cargo build --locked --release -p jury -p jury-witness
      - name: Exercise exact field references and hidden terminal input
        run: python3 scripts/check-linux-input-surfaces --jury target/release/jury
      - name: Exercise exact public review labels through witnessed commands
        run: python3 scripts/check-linux-public-labels --jury target/release/jury --juryd target/release/juryd
      - name: Exercise persisted witnessed access through the real binaries
        run: python3 scripts/check-linux-witness-lifecycle --jury target/release/jury --juryd target/release/juryd
      - name: Exercise governed descriptor approvals through real terminals
        run: python3 scripts/check-linux-descriptor-access --jury target/release/jury --juryd target/release/juryd
      - name: Exercise witnessed owner changes through real approvals
        run: python3 scripts/check-linux-owner-changes --jury target/release/jury --juryd target/release/juryd
      - name: Exercise authenticated approval summaries through real terminals
        run: python3 scripts/check-linux-approval-review --jury target/release/jury --juryd target/release/juryd
      - name: Exercise safe diagnostics and policy timeout defaults
        run: python3 scripts/check-linux-diagnostics --jury target/release/jury --juryd target/release/juryd
      - name: Exercise role onboarding, remote approval and multi-role recovery
        run: python3 scripts/check-linux-role-onboarding --jury target/release/jury --juryd target/release/juryd
      - name: Exercise shared witness pairs and global checkpoint advancement
        run: python3 scripts/check-linux-shared-policies --jury target/release/jury --juryd target/release/juryd
      - name: Exercise disjoint policy memberships under one checkpoint
        run: python3 scripts/check-linux-shared-policies --jury target/release/jury --juryd target/release/juryd --disjoint
