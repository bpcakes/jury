name: Rust Tests

on:
  pull_request:
    paths:

      - "**"

      - "**/*.rs"

      - "**/.cargo/**"

      - "**/.clippy.toml"

      - "**/.rustfmt.toml"

      - "**/Cargo.lock"

      - "**/Cargo.toml"

      - "**/clippy.toml"

      - "**/rust-toolchain"

      - "**/rust-toolchain.toml"

      - "**/rustfmt.toml"

      - ".cargo/**"

      - ".clippy.toml"

      - ".rustfmt.toml"

      - "Cargo.lock"

      - "Cargo.toml"

      - "clippy.toml"

      - "rust-toolchain"

      - "rust-toolchain.toml"

      - "rustfmt.toml"


      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/jig"
      - "scripts/install-jig.sh"
      - ".github/workflows/rust-tests.yml"
  push:
    branches:
      - "main"
    paths:

      - "**"

      - "**/*.rs"

      - "**/.cargo/**"

      - "**/.clippy.toml"

      - "**/.rustfmt.toml"

      - "**/Cargo.lock"

      - "**/Cargo.toml"

      - "**/clippy.toml"

      - "**/rust-toolchain"

      - "**/rust-toolchain.toml"

      - "**/rustfmt.toml"

      - ".cargo/**"

      - ".clippy.toml"

      - ".rustfmt.toml"

      - "Cargo.lock"

      - "Cargo.toml"

      - "clippy.toml"

      - "rust-toolchain"

      - "rust-toolchain.toml"

      - "rustfmt.toml"


      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/jig"
      - "scripts/install-jig.sh"
      - ".github/workflows/rust-tests.yml"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: scripts/jig check api:fmt
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
          components: rustfmt
      - name: Run rustfmt check
        run: scripts/jig check api:fmt

  clippy:
    name: scripts/jig check api:clippy
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
          components: clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run clippy
        run: scripts/jig check api:clippy

  test:
    name: scripts/jig check api:test-locked
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run locked Rust tests
        run: scripts/jig check api:test-locked
