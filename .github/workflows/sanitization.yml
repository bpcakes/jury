name: Maintained memory provider

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  provider:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.98.1
          cache: false
          rustflags: ""
          components: rustfmt, clippy
      - name: Check provider formatting
        run: cargo fmt --manifest-path third_party/sanitization/Cargo.toml --all -- --check
      - name: Check provider Clippy
        run: cargo clippy --manifest-path third_party/sanitization/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - name: Run provider workspace and Jury's selected native profile
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo prlimit --pid "$$" --memlock=67108864:67108864
          fi
          cargo test --manifest-path third_party/sanitization/Cargo.toml --locked --workspace
          cargo test --manifest-path third_party/sanitization/Cargo.toml --locked -p sanitization --no-default-features --features std,profile-guarded-native,require-fork-exclusion
          cargo test -p jury-protected --locked
