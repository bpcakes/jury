name: Repo Policy

on:
  pull_request:
  push:
    branches:
      - "main"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-policy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-mod-rs:
    name: Check for disallowed mod.rs files
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Detect disallowed mod.rs files
        run: |
          python3 - <<'PYCODE'
          import subprocess
          import sys
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          violations = [p for p in paths if p == b'mod.rs' or p.endswith(b'/mod.rs')]
          for path in violations:
              print('Disallowed mod.rs:', repr(path))
          sys.exit(bool(violations))
          PYCODE



  file-budget:
    name: Enforce repository file budgets
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Check repository file-budget policy
        env:
          JIG_EVENT_NAME: ${{ github.event_name }}
          JIG_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          JIG_PUSH_BEFORE: ${{ github.event.before }}
          JIG_MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          case "$JIG_EVENT_NAME" in
            pull_request)
              scripts/jig check repo:file-budget \
                --comparison-exact-tree "$JIG_PULL_REQUEST_BASE" \
                --comparison-provenance explicit
              ;;
            push)
              scripts/jig check repo:file-budget \
                --comparison-exact-tree "$JIG_PUSH_BEFORE" \
                --comparison-provenance push_before
              ;;
            merge_group)
              scripts/jig check repo:file-budget \
                --comparison-exact-tree "$JIG_MERGE_GROUP_BASE" \
                --comparison-provenance explicit
              ;;
            *)
              scripts/jig check repo:file-budget
              ;;
          esac
