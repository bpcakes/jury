name: Repo Policy

on:
  pull_request:
    paths:



      - "**"

      - "**/*.rs"

      - "**/.cargo/**"

      - "**/.clippy.toml"

      - "**/.rustfmt.toml"

      - "**/Cargo.lock"

      - "**/Cargo.toml"

      - "**/clippy.toml"

      - "**/rust-toolchain"

      - "**/rust-toolchain.toml"

      - "**/rustfmt.toml"

      - ".cargo/**"

      - ".clippy.toml"

      - ".rustfmt.toml"

      - "Cargo.lock"

      - "Cargo.toml"

      - "clippy.toml"

      - "rust-toolchain"

      - "rust-toolchain.toml"

      - "rustfmt.toml"


      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/jig"
      - "scripts/check-rust-file-loc.sh"
      - "scripts/install-jig.sh"

      - ".github/workflows/repo-policy.yml"
  push:
    branches:
      - "main"
    paths:



      - "**"

      - "**/*.rs"

      - "**/.cargo/**"

      - "**/.clippy.toml"

      - "**/.rustfmt.toml"

      - "**/Cargo.lock"

      - "**/Cargo.toml"

      - "**/clippy.toml"

      - "**/rust-toolchain"

      - "**/rust-toolchain.toml"

      - "**/rustfmt.toml"

      - ".cargo/**"

      - ".clippy.toml"

      - ".rustfmt.toml"

      - "Cargo.lock"

      - "Cargo.toml"

      - "clippy.toml"

      - "rust-toolchain"

      - "rust-toolchain.toml"

      - "rustfmt.toml"


      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/jig"
      - "scripts/check-rust-file-loc.sh"
      - "scripts/install-jig.sh"

      - ".github/workflows/repo-policy.yml"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-policy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:


  no-mod-rs:
    name: Check for disallowed mod.rs files
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Detect disallowed mod.rs files
        run: |
          scripts/jig check no-mod-rs

  rust-file-loc:
    name: Enforce agentic-first Rust file size policy
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Check Rust file LOC policy
        env:
          JIG_DEFAULT_BRANCH: "main"
        run: scripts/check-rust-file-loc.sh "$JIG_DEFAULT_BRANCH"
