[package]
name = "jury-core"
description = "Domain boundary for the Jury secrets vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aes-gcm-siv = { version = "=0.12.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20 = { version = "=0.10.2", default-features = false, features = ["rng", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
hpke = { version = "=0.14.0", git = "https://github.com/rozbb/rust-hpke", rev = "57b14d8f156da78be61b23203b962b0985561831", default-features = false, features = ["alloc", "chacha", "mlkem", "x25519"] }
jury-protected = { path = "../jury-protected" }
jury-protocol = { path = "../jury-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
subtle = "=2.6.1"
zeroize = { version = "=1.9.0", default-features = false }
vsss-rs = { version = "=6.0.1", default-features = false, features = ["alloc", "zeroize"] }

[dev-dependencies]
hex = "=0.4.3"
proptest = "1.7"

[lints]
workspace = true
