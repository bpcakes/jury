[package]
name = "jury"
description = "The vault no one can open alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
clap = { version = "=4.5.50", features = ["derive"] }
jury-core = { path = "../jury-core" }
jury-filesystem = { path = "../jury-filesystem" }
close_fds = "=0.3.2"
jury-protected = { path = "../jury-protected" }
jury-process = { path = "../jury-process" }
jury-protocol = { path = "../jury-protocol" }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rustix = { version = "=1.1.4", features = ["fs", "termios"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.11.0", default-features = false }
signal-hook = { version = "=0.4.4", default-features = false, features = ["iterator"] }
zeroize = { version = "=1.9.0", default-features = false }

[dev-dependencies]
tempfile = "=3.23.0"

[lints]
workspace = true
