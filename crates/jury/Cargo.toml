[package]
name = "jury"
description = "The vault no one can open alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "=4.5.50", features = ["derive"] }
jury-core = { path = "../jury-core" }
jury-filesystem = { path = "../jury-filesystem" }
jury-protected = { path = "../jury-protected" }
jury-protocol = { path = "../jury-protocol" }
rustix = { version = "=1.1.4", features = ["termios"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.11.0", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }

[dev-dependencies]
tempfile = "=3.23.0"

[lints]
workspace = true
