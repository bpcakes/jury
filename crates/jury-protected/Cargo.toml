[package]
name = "jury-protected"
description = "Protected-memory, entropy, redaction, and process-safety primitives for Jury"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
aho-corasick = "=1.1.3"
base64 = "=0.22.1"
getrandom = "=0.4.3"
rlimit = "=0.11.0"
sanitization = { git = "https://github.com/featherenvy/sanitization.git", rev = "3f0a72c5640b4919dec93799725c7573b2878a8c", default-features = false, features = ["std", "profile-guarded-native", "require-fork-exclusion"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
zeroize = "=1.9.0"

[lints]
workspace = true
