[package]
name = "jury-protected"
description = "Protected-memory, entropy, redaction, and process-safety primitives for Jury"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
aho-corasick = "=1.1.3"
base64 = "=0.22.1"
getrandom = "=0.4.3"
rlimit = "=0.11.0"
sanitization = { path = "../../third_party/sanitization/crates/sanitization", default-features = false, features = ["std", "profile-guarded-native", "require-fork-exclusion"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.23.0"

[lints]
workspace = true
