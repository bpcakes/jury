[package]
name = "jury-filesystem"
description = "Capability-held repository and private-state filesystem primitives for Jury"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
getrandom = "=0.4.3"
jury-protected = { path = "../jury-protected" }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
tempfile = "=3.23.0"

[lints]
workspace = true
