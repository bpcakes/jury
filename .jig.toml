_commit = "45449a67ba897fd924b92d6f24a7138c5dd159d2"
_src_path = "https://github.com/bpcakes/jig-sh.git"
_template_local_path = ""
_template_mode = ""
application_contracts_enabled = false
ci_github_runner = "ubuntu-latest"
default_branch = "main"
frontend_apps = []
frontend_workspace_roots = []
harness_footprint = "full"
repo_name = "Jury"
rust_crate_roots = ["."]
schema_docs_dir = "docs/schema"
schema_dump_enabled = false
sqlx_enabled = false
template_source_url = ""
web_package_manager = "bun"

[[agent_tooling.codex.marketplaces]]
id = "jig-skills"
plugins = [
    "jig-rust@jig-skills",
    "jig-swift@jig-skills",
    "jig-typescript@jig-skills",
    "jig-exec-plans@jig-skills",
]
source = "bpcakes/jig-skills"

[commands]
api_clippy_command = '''if [ -f Cargo.toml ]; then cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -D clippy::mod_module_files; else printf '%s\n' 'No Cargo.toml found; skipping cargo clippy.'; fi'''
api_fmt_command = '''if [ -f Cargo.toml ]; then cargo fmt --all -- --check; else printf '%s\n' 'No Cargo.toml found; skipping cargo fmt.'; fi'''
api_test_command = '''if [ -f Cargo.toml ]; then cargo test --workspace --locked; else printf '%s\n' 'No Cargo.toml found; skipping cargo test.'; fi'''
api_test_locked_command = '''if [ -f Cargo.toml ]; then cargo test --workspace --locked; else printf '%s\n' 'No Cargo.toml found; skipping cargo test-locked.'; fi'''
api_test_cli_locked_command = 'cargo test --locked -p jury'
api_test_libraries_locked_command = 'cargo test --locked --workspace --exclude jury'
repo_bootstrap_command = '''if [ -f Cargo.toml ]; then cargo fetch; else printf '%s\n' 'No Cargo.toml found; skipping cargo bootstrap.'; fi; if [ -f web/package.json ]; then (cd web && bun install); fi'''

[dev]
http2 = true
https = false
https_port = 1443
lan = false
proxy_port = 1355
tld = "localhost"
workspace_discovery = false

[[dev.apps]]
argv = [
    "bun",
    "run",
    "dev",
]
dir = "web"
kind = "vite"
name = "site"

[execution]
command_output_limit_bytes = 67108864
command_timeout_seconds = 1800

[repository]
affected_ignore = [
    ".env",
    ".env.*",
    "**/.env",
    "**/.env.*",
    "README.md",
    "**/README.md",
    "AGENTS.md",
    "**/AGENTS.md",
    "agent-map.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "docs/**",
    "LICENSE",
    "LICENSE.*",
    ".github/**",
]
default_check_profile = "verify"

[[repository.actions]]
description = "Run Rust Clippy with repository policy."
effects = [
    "read_only",
    "process",
]
inputs = [
    "Cargo.toml",
    "Cargo.lock",
    "**/Cargo.toml",
    "**/Cargo.lock",
    "**/*.rs",
    "rust-toolchain",
    "rust-toolchain.toml",
    "**/rust-toolchain",
    "**/rust-toolchain.toml",
    ".cargo/**",
    "**/.cargo/**",
    "rustfmt.toml",
    ".rustfmt.toml",
    "**/rustfmt.toml",
    "**/.rustfmt.toml",
    "clippy.toml",
    ".clippy.toml",
    "**/clippy.toml",
    "**/.clippy.toml",
]
intent = "check"
legacy_aliases = ["jig.clippy"]

[repository.actions.provenance]
effects = "inherited"
inputs = "inherited"
intent = "inherited"
legacy_aliases = "inherited"
runner = "overridden"
target = "inherited"

[repository.actions.runner]
command = "api_clippy_command"
kind = "command"

[repository.actions.target]
action = "clippy"
component = "api"

